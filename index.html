<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Interactivo: I.E. Juan Jiménez Pimentel</title>
    <style>
        :root {
            /* Colores Institucionales: Azul, Rojo, Amarillo */
            --primary-blue: #003399;
            --secondary-yellow: #FFCC00;
            --accent-red: #CC0000;
            
            --background: #f0f2f5;
            --surface: #FFFFFF;
            --text: #1a1a1a;
            --correct: #2E7D32;
            --incorrect: #D32F2F;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background: var(--surface);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 750px;
            padding: 30px;
            box-sizing: border-box;
            position: relative;
            border-top: 10px solid var(--primary-blue);
            border-bottom: 10px solid var(--accent-red);
        }

        /* Espacio para el Logo */
        .header-logo {
            text-align: center;
            margin-bottom: 15px;
        }
        .header-logo img {
            max-height: 100px;
            width: auto;
        }

        h1 {
            color: var(--primary-blue);
            text-align: center;
            font-size: 24px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .meta-info {
            text-align: center;
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
            background-color: var(--secondary-yellow);
            padding: 8px;
            border-radius: 5px;
            font-weight: bold;
        }

        .progress-bar-container {
            background: #ddd;
            border-radius: 10px;
            height: 14px;
            width: 100%;
            margin-bottom: 25px;
            overflow: hidden;
            border: 1px solid #ccc;
        }

        .progress-bar {
            background: linear-gradient(to right, var(--primary-blue), var(--accent-red));
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-box {
            margin-bottom: 25px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            border-left: 5px solid var(--accent-red);
            padding-left: 15px;
        }

        /* Tipos de interacción */
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            background: #fff;
            border: 2px solid var(--primary-blue);
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            font-weight: 500;
        }

        .option-item:hover {
            background: #eef2ff;
            transform: translateX(5px);
        }

        .option-item input {
            margin-right: 15px;
            accent-color: var(--primary-blue);
        }

        .select-blank {
            padding: 8px 12px;
            font-size: 16px;
            border-radius: 6px;
            border: 2px solid var(--primary-blue);
            background-color: #fff;
            font-weight: bold;
        }

        .match-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .match-label {
            font-weight: 600;
            width: 50%;
            color: var(--primary-blue);
        }

        .sort-container {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }

        .sort-btn {
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: transform 0.1s;
        }

        .sort-btn.good { background-color: var(--primary-blue); }
        .sort-btn.bad { background-color: var(--accent-red); }
        .sort-btn:active { transform: scale(0.95); }

        .action-btn {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            display: none;
            box-shadow: 0 4px 0 #800000;
        }

        .action-btn:active {
            box-shadow: none;
            transform: translateY(4px);
        }

        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
            border: 2px solid transparent;
        }

        .feedback.correct-bg { background-color: #d4edda; color: #155724; border-color: #c3e6cb; }
        .feedback.incorrect-bg { background-color: #f8d7da; color: #721c24; border-color: #f5c6cb; }

        /* Resultados */
        .result-screen {
            text-align: center;
            display: none;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: var(--primary-blue);
            color: var(--secondary-yellow);
            font-size: 40px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            border: 5px solid var(--accent-red);
        }

        .result-msg {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .retry-btn {
            background: var(--secondary-yellow);
            color: #000;
            border: 2px solid var(--primary-blue);
            padding: 16px 32px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header-logo">
        <img src="logo.png" alt="Logo I.E. Juan Jiménez Pimentel">
    </div>
    
    <h1>Cuidamos juntos nuestra escuela</h1>
    <div class="meta-info">I.E. Juan Jiménez Pimentel | Docente: Anita Cabrera Arévalo | 2° "A"</div>

    <div class="progress-bar-container">
        <div id="progress" class="progress-bar"></div>
    </div>

    <div id="quiz-panel">
        <div class="question-box">
            <div id="question-text" class="question-text">Cargando desafío...</div>
            <div id="interaction-area"></div>
        </div>
        <button id="validate-btn" class="action-btn" onclick="checkComplexAnswer()">VERIFICAR RESPUESTA</button>
        <div id="feedback-box" class="feedback"></div>
    </div>

    <div id="result-panel" class="result-screen">
        <h2>REPORTE FINAL</h2>
        <div id="score-display" class="score-circle">0/50</div>
        <div id="result-message" class="result-msg"></div>
        <div id="retry-area"></div>
    </div>
</div>

<script>
    // Banco de datos (50 preguntas sencillas para estudiantes)
    const dataset = [
        // 1-10: Opción Múltiple
        { type: "single", q: "¿Cómo se llama nuestro colegio?", options: ["Juan Jiménez Pimentel", "Sara Antúnez de Mayolo", "Ramón Castilla"], ans: 0 },
        { type: "single", q: "¿En qué grado y sección estás?", options: ["1° Grado 'B'", "2° Grado 'A'", "3° Grado 'C'"], ans: 1 },
        { type: "single", q: "¿Cómo estaban los pasillos del colegio cuando los niños tiraron desperdicios?", options: ["Muy limpios", "Llenos de basura", "Pintados de colores"], ans: 1 },
        { type: "single", q: "¿Qué tipo de basura se encontró tirada en los jardines?", options: ["Juguetes viejos", "Botellas, cáscaras de frutas y envolturas", "Ropa y zapatos"], ans: 1 },
        { type: "single", q: "¿Cómo nos sentimos cuando estudiamos en un salón limpio y ordenado?", options: ["Tristes y enojados", "Felices, cómodos y contentos", "Aburridos"], ans: 1 },
        { type: "single", q: "¿Qué peligro puede causar una cáscara de plátano tirada en el suelo?", options: ["Que alguien se saque una buena nota", "Un resbalón y una caída peligrosa", "Que crezca un árbol"], ans: 1 },
        { type: "single", q: "¿Cuál es el lugar correcto para botar la basura?", options: ["Debajo de las carpetas", "En el patio de recreo", "En el tacho de basura"], ans: 2 },
        { type: "single", q: "¿Cómo se llama la bolsita especial que usamos para guardar nuestras envolturas?", options: ["Bolsita residual", "Bolsita de juguetes", "Bolsita de dormir"], ans: 0 },
        { type: "single", q: "¿Cómo debemos trabajar para que nuestra aula se mantenga limpia?", options: ["Cada uno por su lado sin ayudar", "En equipo y colaborando todos juntos", "Esperando que limpie el profesor"], ans: 1 },
        { type: "single", q: "¿Qué debemos hacer antes de hablar o dar nuestra opinión en clase?", options: ["Gritar fuerte para que nos escuchen", "Levantar la mano de forma ordenada", "Hablar al mismo tiempo que el amigo"], ans: 1 },

        // 11-20: Selección Múltiple
        { type: "multiple", q: "Selecciona los animales e insectos peligrosos que aparecen cuando hay mucha basura acumulada:", options: ["Hermosas mariposas", "Moscas fastidiosas", "Cucarachas sucias", "Ratones peligrosos"], ans: [1, 2, 3] },
        { type: "multiple", q: "Marca las envolturas o restos que son peligrosos porque nos hacen resbalar si los pisamos:", options: ["Envolturas plásticas de galletas", "Hojas secas de los árboles", "Cáscaras de frutas como el plátano"], ans: [0, 2] },
        { type: "multiple", q: "Selecciona los materiales correctos que nos ayudan a limpiar el salón de clases:", options: ["La escoba y el recogedor", "Pinturas para las paredes", "Un paño para limpiar las mesas"], ans: [0, 2] },
        { type: "multiple", q: "Marca las buenas acciones que demuestran que cuidamos nuestra escuela:", options: ["Botar las envolturas en los tachos", "Regar y cuidar las plantas del jardín", "Rayar las paredes con lápices"], ans: [0, 1] },
        { type: "multiple", q: "Selecciona los acuerdos de convivencia que nos ayudan a trabajar felices en el aula:", options: ["Escuchar con respeto cuando alguien habla", "Levantar la mano para participar", "Correr y saltar sobre las carpetas"], ans: [0, 1] },
        { type: "multiple", q: "Marca los residuos que sí podemos reciclar para no contaminar la Tierra:", options: ["Botellas de plástico vacías", "Restos de comida usada", "Papeles y cartones limpios"], ans: [0, 2] },
        { type: "multiple", q: "Selecciona los objetos abandonados que acumulan agua de lluvia y atraen zancudos:", options: ["Platos descartables tirados", "Botellas vacías boca arriba", "Hojas de cuadernos"], ans: [0, 1] },
        { type: "multiple", q: "Marca las formas correctas de usar tu bolsita residual en el colegio:", options: ["Guardar ahí mis envolturas de dulces", "Dejarla tirada en el patio", "Tenerla cerca a mi carpeta para no ensuciar"], ans: [0, 2] },
        { type: "multiple", q: "Selecciona quiénes tienen la responsabilidad de mantener el colegio limpio:", options: ["Todos los alumnos y alumnas", "Solo el director del colegio", "Los estudiantes junto a los trabajadores de limpieza"], ans: [0, 2] },
        { type: "multiple", q: "Marca las buenas ideas para ahorrar papel y cuidar los árboles:", options: ["Usar las hojas de los cuadernos por los dos lados", "Arrancar hojas para hacer avioncitos", "Usar hojas de reúso para hacer borradores"], ans: [0, 2] },

        // 21-30: Completar
        { type: "fill", q: "Hoy aprenderemos a trabajar en {blank} para mantener nuestra escuela muy limpia.", options: ["equipo", "soledad", "silencio"], ans: "equipo" },
        { type: "fill", q: "Si dejamos la basura tirada por todos lados, nuestra escuela se verá sucia y {blank}.", options: ["hermosa", "fea", "divertida"], ans: "fea" },
        { type: "fill", q: "Las botellas tiradas en el jardín se llenan de agua y se vuelven nidos de {blank}.", options: ["zancudos", "abejas", "palomas"], ans: "zancudos" },
        { type: "fill", q: "Para poder hablar sin interrumpir a los demás, debemos {blank} la mano.", options: ["esconder", "levantar", "cruzar"], ans: "levantar" },
        { type: "fill", q: "El planeta Tierra es el hogar que compartimos todos los seres {blank}.", options: ["vivos", "invisibles", "lejanos"], ans: "vivos" },
        { type: "fill", q: "Los restos de galletas y caramelos deben ir dentro del {blank}.", options: ["tacho", "estuche", "bolsillo"], ans: "tacho" },
        { type: "fill", q: "Cuando entramos al aula y vemos que todo está ordenado nos ponemos muy {blank}.", options: ["contentos", "asustados", "aburridos"], ans: "contentos" },
        { type: "fill", q: "No debemos arrancar las flores ni las hojas de las plantas del {blank}.", options: ["techo", "jardín", "piso"], ans: "jardín" },
        { type: "fill", q: "Romper los papeles y tirarlos al suelo hace que el salón se vuelva {blank}.", options: ["ordenado", "desordenada", "limpio"], ans: "desordenada" },
        { type: "fill", q: "Cada estudiante debe cuidar que su {blank} se quede limpia antes de ir al recreo.", options: ["carpeta", "mochila", "lonchera"], ans: "carpeta" },

        // 31-40: Relacionar
        { type: "match", q: "Une cada acción con el lugar correcto donde debe hacerse:", labels: ["Botar envolturas", "Cuidar las flores", "Estudiar atentos"], options: ["En el tacho de basura", "En el jardín de la escuela", "Dentro del aula de clases"], correctMap: { "Botar envolturas": "En el tacho de basura", "Cuidar las flores": "En el jardín de la escuela", "Estudiar atentos": "Dentro del aula de clases" } },
        { type: "match", q: "Relaciona el problema con su peligro o consecuencia:", labels: ["Cáscara de plátano", "Basura amontonada", "Botella con agua"], options: ["Atrae moscas y ratones", "Causa un resbalón y caída", "Se vuelve nido de zancudos"], correctMap: { "Cáscara de plátano": "Causa un resbalón y caída", "Basura amontonada": "Atrae moscas y ratones", "Botella con agua": "Se vuelve nido de zancudos" } },
        { type: "match", q: "Une el objeto del aula con su utilidad:", labels: ["Las carpetas", "El tacho", "La pizarra"], options: ["Para sentarse a trabajar", "Para botar los desperdicios", "Para ver lo que escribe la profesora"], correctMap: { "Las carpetas": "Para sentarse a trabajar", "El tacho": "Para botar los desperdicios", "La pizarra": "Para ver lo que escribe la profesora" } },
        { type: "match", q: "Une cómo está el salón con la emoción que te da:", labels: ["Salón limpio", "Salón con basura", "Salón con mucho ruido"], options: ["Me da alegría y comodidad", "Me pone triste y descontento", "Me hace sentir molesto"], correctMap: { "Salón limpio": "Me da alegría y comodidad", "Salón con basura": "Me pone triste y descontento", "Salón con mucho ruido": "Me hace sentir molesto" } },
        { type: "match", q: "Une el objeto con su función para cuidar el colegio:", labels: ["Bolsita residual", "La escoba", "El agua pura"], options: ["Para guardar envolturas pequeñas", "Para dejar el piso sin polvo", "Para regar las plantitas"], correctMap: { "Bolsita residual": "Para guardar envolturas pequeñas", "La escoba": "Para dejar el piso sin polvo", "El agua pura": "Para regar las plantitas" } },
        { type: "match", q: "Une la basura con el tipo de desecho que es:", labels: ["Cáscara de manzana", "Botella plástica vacía", "Papel roto en trozos"], options: ["Residuo de fruta", "Objeto que se puede reciclar", "Residuo de papel común"], correctMap: { "Cáscara de manzana": "Residuo de fruta", "Botella plástica vacía": "Objeto que se puede reciclar", "Papel roto en trozos": "Residuo de papel común" } },
        { type: "match", q: "Une las buenas acciones de respeto en el aula:", labels: ["Levantar la mano", "Escuchar al compañero", "Compartir los colores"], options: ["Para poder hablar", "Cuando da su opinión", "Para trabajar en equipo"], correctMap: { "Levantar la mano": "Para poder hablar", "Escuchar al compañero": "Cuando da su opinión", "Compartir los colores": "Para trabajar en equipo" } },
        { type: "match", q: "Une cada objeto con el lugar donde se guarda:", labels: ["Envoltura de galleta", "Hojas secas de árbol", "Cuaderno de trabajo"], options: ["En el tacho de basura", "Debajo del árbol del patio", "Dentro de la mochila"], correctMap: { "Envoltura de galleta": "En el tacho de basura", "Hojas secas de árbol": "Debajo del árbol del patio", "Cuaderno de trabajo": "Dentro de la mochila" } },
        { type: "match", q: "Une las acciones peligrosas con el accidente que causan:", labels: ["Correr por las escaleras", "Dejar platos llenos de agua", "Pisar basura plástica"], options: ["Causa caídas y golpes", "Trae zancudos que pican", "Provoca resbalones duros"], correctMap: { "Correr por las escaleras": "Causa caídas y golpes", "Dejar platos llenos de agua": "Trae zancudos que pican", "Pisar basura plástica": "Provoca resbalones duros" } },
        { type: "match", q: "Une el momento de la escuela con la buena rutina:", labels: ["Al terminar el recreo", "Al salir del salón", "Al terminar la lonchera"], options: ["Entrar al aula ordenadamente", "Apagar las luces del salón", "Botar las servilletas al tacho"], correctMap: { "Al terminar el recreo": "Entrar al aula ordenadamente", "Al salir del salón": "Apagar las luces del salón", "Al terminar la lonchera": "Botar las servilletas al tacho" } },

        // 41-50: Clasificar
        { type: "sort", q: "Clasifica esta acción: 'Arrojar las botellas plásticas vacías en los pasillos de la escuela'", ans: "Irresponsable" },
        { type: "sort", q: "Clasifica esta acción: 'Guardar las envolturas de mi galleta dentro de mi bolsita residual'", ans: "Responsable" },
        { type: "sort", q: "Clasifica esta acción: 'Levantar la mano de forma ordenada antes de hablar en la clase'", ans: "Responsable" },
        { type: "sort", q: "Clasifica esta acción: 'Dejar platos descartables con agua de lluvia en los jardines'", ans: "Irresponsable" },
        { type: "sort", q: "Clasifica esta acción: 'Ayudar con alegría a mis compañeros a limpiar el salón de clases'", ans: "Responsable" },
        { type: "sort", q: "Clasifica esta acción: 'Tirar las cáscaras de mandarina debajo de las carpetas'", ans: "Irresponsable" },
        { type: "sort", q: "Clasifica esta acción: 'Escuchar con atención y respeto cuando un compañero está hablando'", ans: "Responsable" },
        { type: "sort", q: "Clasifica esta acción: 'Dejar las envolturas de caramelos tiradas en la cancha de fútbol'", ans: "Irresponsable" },
        { type: "sort", q: "Clasifica esta acción: 'Botar los papeles rotos directamente adentro del tacho de basura'", ans: "Responsable" },
        { type: "sort", q: "Clasifica esta acción: 'Rayar las mesas y las sillas del colegio con lapiceros o colores'", ans: "Irresponsable" }
    ];

    let currentIdx = 0;
    let score = 0;
    const totalQuestions = dataset.length;

    function initGame() {
        currentIdx = 0;
        score = 0;
        document.getElementById("quiz-panel").style.display = "block";
        document.getElementById("result-panel").style.display = "none";
        showQuestion();
    }

    function showQuestion() {
        const progressPercent = (currentIdx / totalQuestions) * 100;
        document.getElementById("progress").style.width = progressPercent + "%";

        const qData = dataset[currentIdx];
        const textContainer = document.getElementById("question-text");
        const area = document.getElementById("interaction-area");
        const validateBtn = document.getElementById("validate-btn");
        const feedback = document.getElementById("feedback-box");

        area.innerHTML = "";
        feedback.style.display = "none";
        validateBtn.style.display = "none";

        textContainer.innerText = `${qData.q}`;

        if (qData.type === "single") {
            const ul = document.createElement("ul");
            ul.className = "options-list";
            qData.options.forEach((opt, idx) => {
                const li = document.createElement("li");
                li.className = "option-item";
                li.innerText = opt;
                li.onclick = () => selectSingle(idx);
                ul.appendChild(li);
            });
            area.appendChild(ul);
        } else if (qData.type === "multiple") {
            validateBtn.style.display = "block";
            const ul = document.createElement("ul");
            ul.className = "options-list";
            qData.options.forEach((opt, idx) => {
                const li = document.createElement("li");
                li.className = "option-item";
                li.innerHTML = `<input type="checkbox" value="${idx}"> <span>${opt}</span>`;
                li.onclick = (e) => {
                    if(e.target.tagName !== 'INPUT') {
                        const cb = li.querySelector('input');
                        cb.checked = !cb.checked;
                    }
                };
                ul.appendChild(li);
            });
            area.appendChild(ul);
        } else if (qData.type === "fill") {
            validateBtn.style.display = "block";
            const parts = qData.q.split("{blank}");
            textContainer.innerHTML = parts[0];
            const select = document.createElement("select");
            select.className = "select-blank";
            select.id = "fill-select";
            const defaultOpt = document.createElement("option");
            defaultOpt.text = "-- elegir --";
            defaultOpt.value = "";
            select.appendChild(defaultOpt);
            qData.options.forEach(opt => {
                const o = document.createElement("option");
                o.text = opt;
                o.value = opt;
                select.appendChild(o);
            });
            textContainer.appendChild(select);
            if(parts[1]) textContainer.appendChild(document.createTextNode(parts[1]));
        } else if (qData.type === "match") {
            validateBtn.style.display = "block";
            qData.labels.forEach(label => {
                const row = document.createElement("div");
                row.className = "match-row";
                const span = document.createElement("span");
                span.className = "match-label";
                span.innerText = label;
                const select = document.createElement("select");
                select.className = "match-select";
                select.setAttribute("data-label", label);
                const defaultOpt = document.createElement("option");
                defaultOpt.text = "?";
                defaultOpt.value = "";
                select.appendChild(defaultOpt);
                qData.options.forEach(opt => {
                    const o = document.createElement("option");
                    o.text = opt;
                    o.value = opt;
                    select.appendChild(o);
                });
                row.appendChild(span);
                row.appendChild(select);
                area.appendChild(row);
            });
        } else if (qData.type === "sort") {
            const container = document.createElement("div");
            container.className = "sort-container";
            const btnGood = document.createElement("button");
            btnGood.className = "sort-btn good";
            btnGood.innerText = "Responsable";
            btnGood.onclick = () => selectSort("Responsable");
            const btnBad = document.createElement("button");
            btnBad.className = "sort-btn bad";
            btnBad.innerText = "Irresponsable";
            btnBad.onclick = () => selectSort("Irresponsable");
            container.appendChild(btnGood);
            container.appendChild(btnBad);
            area.appendChild(container);
        }
    }

    function selectSingle(idx) {
        const qData = dataset[currentIdx];
        const isCorrect = (idx === qData.ans);
        if (isCorrect) score++;
        showFeedback(isCorrect);
    }

    function selectSort(value) {
        const qData = dataset[currentIdx];
        const isCorrect = (value === qData.ans);
        if (isCorrect) score++;
        showFeedback(isCorrect);
    }

    function checkComplexAnswer() {
        const qData = dataset[currentIdx];
        let isCorrect = true;
        if (qData.type === "multiple") {
            const checkboxes = document.querySelectorAll("#interaction-area input[type='checkbox']");
            let selected = [];
            checkboxes.forEach(cb => { if (cb.checked) selected.push(parseInt(cb.value)); });
            isCorrect = (selected.length === qData.ans.length && qData.ans.every(val => selected.includes(val)));
        } else if (qData.type === "fill") {
            isCorrect = (document.getElementById("fill-select").value === qData.ans);
        } else if (qData.type === "match") {
            const selects = document.querySelectorAll(".match-select");
            selects.forEach(select => {
                if (qData.correctMap[select.getAttribute("data-label")] !== select.value) isCorrect = false;
            });
        }
        if (isCorrect) score++;
        showFeedback(isCorrect);
    }

    function showFeedback(isCorrect) {
        const fb = document.getElementById("feedback-box");
        fb.style.display = "block";
        fb.innerText = isCorrect ? "¡CORRECTO! +1 PUNTO" : "INCORRECTO";
        fb.className = `feedback ${isCorrect ? 'correct-bg' : 'incorrect-bg'}`;
        document.getElementById("interaction-area").style.pointerEvents = "none";
        if(document.getElementById("validate-btn")) document.getElementById("validate-btn").style.display = "none";
        setTimeout(() => {
            document.getElementById("interaction-area").style.pointerEvents = "auto";
            nextQuestion();
        }, 1200);
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < totalQuestions) showQuestion();
        else endGame();
    }

    function endGame() {
        document.getElementById("quiz-panel").style.display = "none";
        document.getElementById("result-panel").style.display = "block";
        document.getElementById("progress").style.width = "100%";
        document.getElementById("score-display").innerText = `${score}/50`;
        const msg = document.getElementById("result-message");
        const retryArea = document.getElementById("retry-area");
        if (score >= 35) {
            msg.innerHTML = "¡EXCELENTE TRABAJO! <br> Has aprobado con éxito el compromiso ambiental de la I.E. Juan Jiménez Pimentel.";
            msg.style.color = "var(--primary-blue)";
        } else {
            msg.innerHTML = "NECESITAS REPASAR MÁS. <br> No has alcanzado el puntaje mínimo de aprobación (35/50).";
            msg.style.color = "var(--accent-red)";
            const btn = document.createElement("button");
            btn.className = "retry-btn";
            btn.innerText = "REINTENTAR AHORA";
            btn.onclick = initGame;
            retryArea.appendChild(btn);
        }
    }

    window.onload = initGame;
</script>
</body>
</html>
